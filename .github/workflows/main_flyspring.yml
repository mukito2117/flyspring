name: Build and deploy Node.js app to Azure Web App - flyspring

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read # Required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'

      - name: Install dependencies and build app
        run: |
          npm install
          npm run build --if-present
          npm run test --if-present

      - name: Prepare deployment package folder
        run: |
          # Clean any existing folder
          rm -rf deploy-package
          mkdir deploy-package
          # Copy necessary files and folders (adjust as per your project)
          cp -r package.json package-lock.json dist node_modules deploy-package/
        
      - name: Upload deployment package artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: deploy-package

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write # Required for azure/login
      contents: read  # Required for actions/checkout

    steps:
      - name: Download deployment package artifact
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_800F8CCFE66C40E1B2764706240AFA5E }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_AD6CB9FA97254EE9B08D651CFCCD6016 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_EDA455F366A84880B7EB44518C07881C }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'flyspring'
          slot-name: 'Production'
          package: './deploy-package'
